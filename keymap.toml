#
# Navigation
#

[[mgr.prepend_keymap]]
on = "K"
run = "plugin augment-command -- parent_arrow -1"

[[mgr.prepend_keymap]]
on = "J"
run = "plugin augment-command -- parent_arrow 1"

[[mgr.prepend_keymap]]
on = [ "\\", "j" ]
run = "plugin augment-command -- first_file"
desc = "Jumps to the first file"

#
# Interface
#

[[mgr.prepend_keymap]]
on = [ "\\", "t", "p" ]
run = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on = [ "\\", "t", "c" ]
run = "plugin toggle-pane max-current"
desc = "Max/unmax current pane"

[[mgr.prepend_keymap]]
on = [ "\\", "t", "r" ]
run = "plugin toggle-pane reset"
desc = "Reset toggled panes"

#
# Linemode
#
[[mgr.prepend_keymap]]
# linemode-plus plugin
on = [ "m", "c" ]
run = "linemode size_mtime"
desc = "Linemode: size+mtime"

  
# Sorting does not override linemode (recommended) 
[[mgr.prepend_keymap]]
on = [ ",", "m" ]
run = [ "sort mtime --reverse=no" ]
desc = "Sort by modified time"

[[mgr.prepend_keymap]]
on = [ ",", "M" ]
run = [ "sort mtime --reverse=yes" ]
desc = "Sort by modified time (reverse)"

[[mgr.prepend_keymap]]
on = [ ",", "b" ]
run = [ "sort btime --reverse=no" ]
desc = "Sort by birth time"

[[mgr.prepend_keymap]]
on = [ ",", "B" ]
run = [ "sort btime --reverse=yes" ]
desc = "Sort by birth time (reverse)"

[[mgr.prepend_keymap]]
on = [ ",", "s" ]
run = [ "sort size --reverse=no" ]
desc = "Sort by size"

[[mgr.prepend_keymap]]
on = [ ",", "S" ]
run = [ "sort size --reverse=yes" ]
desc = "Sort by size (reverse)"


#
# View, edit, diff
#

[[mgr.prepend_keymap]]
on = "<C-d>"
run = "plugin diff"
desc = "Diff the selected with the hovered file"

[[mgr.prepend_keymap]]
on = "e"
run = "shell --block 'nvim \"$@\"'"
desc = "Edit the selected files"

[[mgr.prepend_keymap]]
on = [ "\\", "e" ]
run = "shell --block 'nvim -d \"$@\"'"
desc = "Diff the selected files (nvim)"

[[mgr.prepend_keymap]]
on = [ "\\", "E" ]
run = "shell --block 'vim -d \"$@\"'"
desc = "Diff the selected files (vim)"

[[mgr.prepend_keymap]]
on = "E"
run = "shell --block 'nvim -O \"$@\"'"
desc = "Edit the selected files (vertical stack)"

#
# Yank, paste
#

[[mgr.prepend_keymap]]
on = "<C-y>"
run = [ "plugin wl-clipboard" ]
desc = "Copy path to the clipboard"

[[mgr.prepend_keymap]]
on = [ "\\", "y" ]
run = [ "plugin wl-clipboard" ]
desc = "Copy path to the clipboard"

[[mgr.prepend_keymap]]
on = [ "\\", "p" ]
run = [ "paste --follow" ]

[[mgr.prepend_keymap]]
on = [ "\\", "o", "p" ]
run = [ "plugin ucp paste notify" ]
desc = "Paste"

[[mgr.prepend_keymap]]
on = [ "\\", "o", "y" ]
run = [ "plugin ucp copy notify" ]
desc = "Copy"

#
# Files
#

[[mgr.prepend_keymap]]
on = [ "c", "m" ]
run = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = [ "\\", "-" ]
run = [ "link --follow" ]

[[mgr.prepend_keymap]]
on = [ "\\", "_" ]
run = [ "link --relative --follow" ]

#
# Bookmarks
#

[[mgr.prepend_keymap]]
on = [ "b", "a" ]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "'" ]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "D" ]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

# 
# Media
#

[[mgr.prepend_keymap]]
on = [ "\\", "T" ]
run = 'plugin thumbnail'
desc = "Open current directory in Swayimg gallery"

#
# Utils
#

[[mgr.prepend_keymap]]
on = [ "\\", "S" ]
run = "search --via=rga"
desc = "search with ripgrep-all"

[[mgr.prepend_keymap]]
on = [ "C" ]
run = "plugin ouch zip"
desc = "Compress with ouch"

[[mgr.prepend_keymap]]
on = [ "\\", "g" ]
run = "plugin lazygit"
desc = "run lazygit"

[[mgr.prepend_keymap]]
on = "O"
run = "plugin open-with-cmd -- block"
desc = "Open with command in the terminal"

[[mgr.prepend_keymap]]
on = "o"
run = "plugin open-with-cmd"
desc = "Open with command"

[[mgr.prepend_keymap]]
on = "R"
run = "shell 'xdg-open $0'"
desc = "Open with xdg-open"

[[mgr.prepend_keymap]]
on = [ "\\", "s" ]
run = "plugin what-size"
desc = "Calc size of selection or cwd"

